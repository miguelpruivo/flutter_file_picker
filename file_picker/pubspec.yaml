name: file_picker
description: A package that allows you to use a native file explorer to pick single or multiple absolute file paths, with extension filtering support.
homepage: https://github.com/miguelpruivo/plugins_flutter_file_picker
repository: https://github.com/miguelpruivo/flutter_file_picker
issue_tracker: https://github.com/miguelpruivo/flutter_file_picker/issues
version: 12.0.0-beta.5
publish_to: 'none'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  cross_file: ^0.3.5+2
  file_picker_platform_interface:
    path: ../file_picker_platform_interface
  file_picker_android:
    path: ../file_picker_android
  file_picker_apple:
    path: ../file_picker_apple
  file_picker_linux:
    path: ../file_picker_linux
  file_picker_web:
    path: ../file_picker_web
  file_picker_windows:
    path: ../file_picker_windows

dev_dependencies:
  ffi: ^2.2.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

formatter:
  page_width: 80

flutter:
  plugin:
    platforms:
      android:
        default_package: file_picker_android
      ios:
        default_package: file_picker_apple
      web:
        default_package: file_picker_web
      macos:
        default_package: file_picker_apple
      windows:
        default_package: file_picker_windows
      linux:
        default_package: file_picker_linux
