name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      darwin: ${{ steps.filter.outputs.darwin }}
      linux: ${{ steps.filter.outputs.linux }}
      windows: ${{ steps.filter.outputs.windows }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            darwin:
              - 'packages/file_picker_darwin/**'
              - 'packages/file_picker_platform_interface/**'
              - 'lib/**'
              - 'pubspec.yaml'
              - 'example/**'
              - '.github/workflows/**'
            linux:
              - 'packages/file_picker_linux/**'
              - 'packages/file_picker_platform_interface/**'
              - 'lib/**'
              - 'pubspec.yaml'
              - 'example/**'
              - '.github/workflows/**'
            windows:
              - 'packages/file_picker_windows/**'
              - 'packages/file_picker_platform_interface/**'
              - 'lib/**'
              - 'pubspec.yaml'
              - 'example/**'
              - '.github/workflows/**'
            web:
              - 'packages/file_picker_web/**'
              - 'packages/file_picker_platform_interface/**'
              - 'lib/**'
              - 'pubspec.yaml'
              - 'example/**'
              - '.github/workflows/**'

  setup_flutter_versions:
    runs-on: ubuntu-latest
    outputs:
      flutter-versions: ${{ steps.id_flutter_versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Fetch Flutter versions
        id: id_flutter_versions
        run: dart tool/fetch_versions.dart >> $GITHUB_OUTPUT

  test_flutter_versions:
    needs: setup_flutter_versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ${{ fromJson(needs.setup_flutter_versions.outputs.flutter-versions) }}
    name: Tests on Flutter ${{ matrix.flutter }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        if: matrix.flutter == 'stable' || matrix.flutter == 'beta'
        with:
          channel: ${{ matrix.flutter }}
          cache: true

      - uses: subosito/flutter-action@v2
        if: matrix.flutter != 'stable' && matrix.flutter != 'beta'
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - run: flutter --version
      - run: flutter precache

      - uses: bluefireteam/melos-action@v3

      - name: Verify formatting
        if: matrix.flutter == 'stable'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: melos exec --concurrency=1 -- flutter analyze .

      - name: Run tests
        run: melos run test

  build_linux:
    needs: [check_changes, test_flutter_versions]
    if: ${{ needs.check_changes.outputs.linux == 'true' }}
    runs-on: ubuntu-latest
    name: Build Linux (example app)
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libc++-dev libc++abi-dev
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Build Linux example
        working-directory: example
        run: |
          flutter pub get
          flutter build linux

  build_windows:
    needs: [check_changes, test_flutter_versions]
    if: ${{ needs.check_changes.outputs.windows == 'true' }}
    runs-on: windows-latest
    name: Build Windows (example app)
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Build Windows example
        working-directory: example
        run: |
          flutter pub get
          flutter build windows

  build_macos:
    needs: [check_changes, test_flutter_versions]
    if: ${{ needs.check_changes.outputs.darwin == 'true' }}
    runs-on: macos-latest
    name: Build macOS (example app)
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Build macOS example
        working-directory: example
        run: |
          flutter pub get
          flutter build macos

  build_web:
    needs: [check_changes, test_flutter_versions]
    if: ${{ needs.check_changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    name: Build Web (example app)
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Enable Web
        run: flutter config --enable-web
      - name: Build Web example
        working-directory: example
        run: |
          flutter pub get
          flutter build web --wasm