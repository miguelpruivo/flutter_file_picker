name: file_picker_windows
description: Windows implementation for file_picker.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker_platform_interface:
    path: ../file_picker_platform_interface
  ffi: ^2.1.3
  path: ^1.9.1
  win32: ^6.3.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        dartPluginClass: FilePickerWindows
