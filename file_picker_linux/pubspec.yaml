name: file_picker_linux
description: Linux implementation for file_picker.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker_platform_interface:
    path: ../file_picker_platform_interface
  dbus: ^0.7.12

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      linux:
        dartPluginClass: FilePickerLinux
